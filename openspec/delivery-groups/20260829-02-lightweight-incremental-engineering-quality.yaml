    group: "foundation-correction"
    goal: "补齐 bootstrap-era caller structural input 与 Stable Core Owner-authorized durable coordination semantics 之间的 contract-completion gap，在 pure Policy 之前解析 exact Delivery+Change 的 trusted canonical ChangeState。"
    required: true
    dependsOn: []
    state: completed
    architectureImpact: true
    outputs:
      - "trusted Delivery-Change coordination-state binding contract"
      - "shared trusted coordination resolution for status / next before pure Policy"

  - id: "establish-lightweight-incremental-engineering-gate"
    group: "engineering-quality"
    goal: "建立 cheap / high-signal / low-friction / interactive 的日常 mechanical engineering boundary，防止 changed-code obvious mechanical regression。"
    required: true
    dependsOn:
      - "establish-trusted-change-coordination-state-binding"
    state: completed
    architectureImpact: true
    outputs:
      - "Lightweight Engineering Gate contract"
      - "incremental mechanical regression boundary"

  - id: "establish-structural-dependency-health-fitness"
    group: "engineering-quality"
    goal: "建立 generic structural dependency health，检测 unresolved imports、new runtime cycles、prod→test/spec、runtime→dev-only 等高价值 bad edges。"
    required: true
    dependsOn:
      - "establish-trusted-change-coordination-state-binding"
    state: completed
    architectureImpact: true
    outputs:
      - "Structural Dependency Health contract"
      - "incremental bad-edge detection"

  - id: "establish-high-confidence-repository-entropy-hygiene"
    group: "engineering-quality"
    goal: "建立 conservative high-confidence repository entropy hygiene，减少 dead nodes、stale declarations 与 AI context noise。"
    required: true
    dependsOn:
      - "establish-trusted-change-coordination-state-binding"
    state: completed
    architectureImpact: true
    outputs:
      - "Repository Entropy Hygiene contract"
      - "high-confidence dead/stale material detection"

  - id: "establish-explicit-applicable-check-execution"
    group: "engineering-quality"
    goal: "确保 formal input 已明确要求的 correctness checks 被 exact execution，并形成绑定 exact candidate/check identity 的真实 Result fact。"
    required: true
    dependsOn:
      - "establish-trusted-change-coordination-state-binding"
    state: planned
    architectureImpact: true
    outputs:
      - "Explicit Applicable Check Execution contract"
      - "same-candidate fact consumption boundary"

