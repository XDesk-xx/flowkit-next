      - "incremental mechanical regression boundary"

  - id: "establish-structural-dependency-health-fitness"
    group: "engineering-quality"
    goal: "建立 generic structural dependency health，检测 unresolved imports、new runtime cycles、prod→test/spec、runtime→dev-only 等高价值 bad edges。"
    required: true
    dependsOn: []
    state: planned
    architectureImpact: true
    outputs:
