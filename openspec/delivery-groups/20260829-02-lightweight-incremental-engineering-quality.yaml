goal: "在已完成的 Foundation Lifecycle Kernel 上建立 small but complete、轻量、增量、高可信度的 repository engineering-quality protection，防止 AI 持续开发引入新的机械质量退化，同时不建设 Quality Platform 或新的控制面。"

delivery:
  state: active
  fullTestStatus: pending
  finalizationStatus: pending

scope:
  included:
    - "Incremental Quality Ratchet：无关历史债务不自动阻塞 bounded Change，新增/修改代码不得引入选定的新机械退化"
    - "cheap / high-signal / interactive Lightweight Engineering Gate"
    - "generic Structural Dependency Health for bad dependency edges"
    - "high-confidence Repository Entropy Hygiene for dead/stale material"
    - "exact execution of already-required applicable correctness checks with real Result facts"
    - "simple same-candidate fact reuse when exact candidate/check/config/tool identity remains valid"
    - "repository-local ownership for engineering quality tooling"
    - "bounded Foundation contract-completion correction for trusted Delivery-Change coordination-state authority binding before normal D02 Change activation"
  excluded:
    - "Quality Dashboard / quality score platform"
    - "Gate Registry / Check Registry / Verification Planner / Evidence Platform"
    - "smart test selection or automatic test recommendation authority"
    - "project-specific architecture layer law / path-level mutation policy"
    - "coverage KPI / mutation testing / complexity KPI / duplicate-code hard threshold"
    - "automatic refactor / dependency upgrade / network-dependent security platform"
    - "Agent Runtime / Skill Router / automatic Author-Reviewer loop"
    - "automatic Git authority / promotion lifecycle"

