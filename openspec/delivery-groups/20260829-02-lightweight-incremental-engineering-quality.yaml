  - id: "establish-high-confidence-repository-entropy-hygiene"
    group: "engineering-quality"
    goal: "建立 conservative high-confidence repository entropy hygiene，减少 dead nodes、stale declarations 与 AI context noise。"
    required: true
    dependsOn: []
    state: planned
    architectureImpact: true
    outputs:
      - "Repository Entropy Hygiene contract"
