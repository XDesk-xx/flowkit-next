  - id: "establish-lightweight-incremental-engineering-gate"
    group: "engineering-quality"
    goal: "建立 cheap / high-signal / low-friction / interactive 的日常 mechanical engineering boundary，防止 changed-code obvious mechanical regression。"
    required: true
    dependsOn:
      - "establish-trusted-change-coordination-state-binding"
    state: completed
    architectureImpact: true
    outputs:
      - "Lightweight Engineering Gate contract"
      - "incremental mechanical regression boundary"

  - id: "establish-structural-dependency-health-fitness"
    group: "engineering-quality"
    goal: "建立 generic structural dependency health，检测 unresolved imports、new runtime cycles、prod→test/spec、runtime→dev-only 等高价值 bad edges。"
    required: true
    dependsOn:
      - "establish-trusted-change-coordination-state-binding"
    state: completed
    architectureImpact: true
    outputs:
      - "Structural Dependency Health contract"
      - "incremental bad-edge detection"

  - id: "establish-high-confidence-repository-entropy-hygiene"
    group: "engineering-quality"
    goal: "建立 conservative high-confidence repository entropy hygiene，减少 dead nodes、stale declarations 与 AI context noise。"
    required: true
    dependsOn:
      - "establish-trusted-change-coordination-state-binding"
    state: completed
    architectureImpact: true
    outputs:
      - "Repository Entropy Hygiene contract"
      - "high-confidence dead/stale material detection"

  - id: "correct-openspec-observation-process-failure-portability"
    group: "foundation-correction"
    goal: "纠正既有 OpenSpec thin observation 在 Windows 上对 managed child abnormal termination 的分类/证明缺口，使 process cannot start/complete 的既有 process-failure contract 在支持平台上可被真实验证。"
    required: true
    dependsOn: []
    state: completed
    architectureImpact: false
    outputs:
      - "cross-platform OpenSpec abnormal-process classification correction"
      - "Windows/Linux proof for existing process-failure semantics"

  - id: "establish-explicit-applicable-check-execution"
    group: "engineering-quality"
    goal: "确保 formal input 已明确要求的 correctness checks 被 exact execution，并形成绑定 exact candidate/check identity 的真实 Result fact。"
    required: true
    dependsOn:
      - "establish-trusted-change-coordination-state-binding"
    state: completed
    architectureImpact: true
    outputs:
      - "Explicit Applicable Check Execution contract"
      - "same-candidate fact consumption boundary"

proofConcerns:
  - id: "openspec-observation-process-failure-portability"
    status: "finding-confirmed-correction-completed"
    statement: "Windows Node 22.23.2 exact runtime semantics plus local execution proved the self-SIGKILL fixture reaches the parent as code=1, signal=null, stdout empty, while Linux exposes code=null, signal=SIGKILL. The bounded correction is completed: canonical OpenSpec thin observation now clarifies host-observable process-outcome precedence and portable deterministic boundary proof replaces the non-portable universal self-SIGKILL assertion without platform/exit-code heuristics."
    correctionChange: "correct-openspec-observation-process-failure-portability"

  - id: "coordination-state-authority-source-binding"
    status: "finding-confirmed-correction-completed"
    statement: "earliest applicable proof confirmed a bootstrap-to-Stable-Core authority-binding gap; the bounded corrective Change completed and normal D02 activation may now rely on the corrected trusted coordination-state binding."
    correctionChange: "establish-trusted-change-coordination-state-binding"

recommendedOrder:
