  - "establish-high-confidence-repository-entropy-hygiene"
  - "establish-explicit-applicable-check-execution"

acceptance:
  - "Lightweight Gate catches representative selected regressions and remains interactive rather than becoming a mini Full Test"
  - "selected generic dependency-graph corruption is detected"
  - "high-confidence repository entropy is detected with acceptable false-positive behavior"
  - "explicit required checks execute exactly and produce real candidate-bound Result facts"
  - "unrelated historical debt does not automatically block bounded Changes"
  - "no Gate Registry, Verification Planner, Evidence Platform, Quality Dashboard, smart test planner, architecture-rule platform or new lifecycle state machine is introduced"

