  - "converge-reviewer-action-guidance"

acceptance:
  - "exact current Action is supplied by Flowkit and is not guessed from Run history"
  - "exact canonical Guidance identity is trusted, Action-aligned, content-bound and frozen into ActionPackage"
  - "wrong-Action Guidance substitution fails closed"
  - "existing ActionPackageRef and ApplicableCheck executionInputRef naturally include Guidance identity"
  - "long-running Author and Reviewer can consume exact bounded HOW without requiring a new AI session per Action"
  - "Action Guidance never decides next Action, Role, Owner authority or Verification truth"
  - "Author revise remains Author mutation; Reviewer remains independent and mutation-free"
  - "canonical Action Guidance has one truth location under skills/actions/**"
  - "method evolution remains internal to stable Action Skill identities and is recorded by OpenSpec/Git history"
  - "Mechanical Preflight reuses D02 quality facts and does not become a new lifecycle/Verification surface"
  - "Run concision / literal discipline / continuation proof are absorbed without new Registry/Platform"
  - "one Action → one real Result → terminal → STOP"
  - "no Registry / Router / Runtime / automatic loop / second identity subsystem is introduced"

