proofConcerns:
  - id: "trusted-action-guidance-identity-binding"
    status: "proof-first"
    statement: "Change 1 must prove deterministic exact Action → canonical Guidance binding, exact content identity, wrong-Action fail-closed behavior, and natural inclusion in existing ActionPackageRef / executionInputRef without a second identity subsystem."

  - id: "author-mechanical-preflight-granularity"
    status: "required-capability-independent-change-proof-gated"
    statement: "Mechanical Preflight is required inside Author apply/revise-apply HOW; only independent machine-readable/domain/config/acceptance proof may justify adding a separate Change by later explicit Owner composition revision."

  - id: "agent-guidance-compatibility"
    status: "contingency-not-in-initial-composition"
    statement: "Direct canonical Guidance consumption is tried first. Only a recorded real failure plus explicit Owner composition revision may add establish-agent-guidance-compatibility."

  - id: "artifact-convergence-and-chronology"
    status: "proof-first-corrective"
    statement: "Prove whether canonical Explore/Design artifacts are retaining superseded reasoning or review chronology beyond current truth, then correct only Action Guidance/bootstrap HOW needed for convergence-in-place; file size remains diagnostic rather than a hard correctness Gate."

