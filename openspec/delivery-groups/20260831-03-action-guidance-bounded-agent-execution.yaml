    projectOrdinal: 22
    group: "action-guidance"
    goal: "纠正多轮 review/revise 中 canonical OpenSpec artifact 累积执行 chronology 与 superseded reasoning 的问题，冻结 current converged truth / Run chronology / Git history 的最小 ownership 与 convergence-in-place HOW，为 Reviewer Guidance convergence 提供稳定输入边界。"
