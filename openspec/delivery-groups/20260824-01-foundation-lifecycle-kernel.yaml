id: "20260824-01-foundation-lifecycle-kernel"
createdAt: "2026-08-24"
branch: "delivery/20260824-01-foundation-lifecycle-kernel"

goal: "建立最小、稳定、可验证并可晋升的 Flowkit Foundation Lifecycle Kernel；本 Delivery 由外部 authority 管理，完成并经 Owner promotion 后才可作为 Delivery 02 的 stable manager。"

delivery:
  state: active
  fullTestStatus: not-ready

scope:
  included:
    - "canonical Owner / Author / Reviewer / Verification authority and identity contracts"
    - "Action lifecycle domain contract and minimal single-current-Action semantics"
    - "durable Run / Result persistence and integrity validation"
    - "ActionPackage and exact Result admission boundary"
    - "single-current-Action execution / exact admission / terminal / STOP boundary"
    - "Policy and deterministic next-boundary contract"
    - "cross-Delivery Memo contract surfaced primarily at Delivery Start"
    - "mutation authority and explicit Git checkpoint boundary"
    - "exact managed OpenSpec 1.10.0 / Archify 2.15.0 toolchain resolution"
    - "thin OpenSpec integration without duplicating OpenSpec lifecycle authority"
    - "minimal Flowkit CLI surface over Core"
    - "Windows Native and Linux x64 detached whole-manager acceptance"
  excluded:
    - "Delivery 01 self-management by the candidate runtime"
    - "automatic Owner decisions"
    - "automatic Author / Reviewer loop"
    - "automatic next-Action execution"
    - "multi-Agent orchestration platform"
    - "dynamic Agent / Provider / Skill / Tool / Gate registries"
    - "generic evidence platform"
    - "web management console"
    - "background daemon"
    - "large plugin framework"
    - "Flowkit replacement of OpenSpec authority"
    - "Archify as lifecycle truth"
    - "runtime binaries, node_modules or pnpm store in Git"

architecture:
  impact: true
  archifyPlan: "required"

changes:
  - id: "establish-lifecycle-authority-and-identity-contracts"
    group: "foundation"
    goal: "建立 Owner、Role、Delivery、Change、Action 的 canonical authority / identity contract 与 fail-closed domain rules。"
    required: true
    dependsOn:
      []
    state: completed
    architectureImpact: true
    outputs:
      - "authority and identity domain contract"
      - "role separation invariants"

  - id: "establish-action-lifecycle-domain-contract"
    group: "foundation"
    goal: "定义 prepared、resumed、terminal、current Action identity 与 single-current-Action invariant。"
    required: true
    dependsOn:
      - "establish-lifecycle-authority-and-identity-contracts"
    state: completed
    architectureImpact: true
    outputs:
      - "Action lifecycle domain contract"
      - "legal transition invariants"

  - id: "establish-run-result-persistence"
    group: "execution"
    goal: "建立真实 durable Run / Result persistence、serialization、read/write 与 resume-safe integrity validation。"
    required: true
    dependsOn:
      - "establish-action-lifecycle-domain-contract"
    state: completed
    architectureImpact: true
    outputs:
      - "Run persistence"
      - "Result persistence"
      - "integrity validation"

  - id: "establish-action-package-and-result-admission"
    group: "execution"
    goal: "建立 Core prepare exact ActionPackage、external execution 与 exact Result admission boundary。"
    required: true
    dependsOn:
      - "establish-run-result-persistence"
    state: completed
    architectureImpact: true
    outputs:
      - "ActionPackage contract"
      - "Result admission contract"

  - id: "establish-single-action-execution-terminal-boundary"
    group: "execution"
    goal: "固定一次完整 Standard Action invocation：Core 内部 establish CurrentAction/prepared + form exact ActionPackage → execute exactly one Standard Action → Core 内部 exact Result admission + terminal → report continuation fact → STOP；prepare 不成为独立 Action/Run/STOP，并 proof 既有 resumed lifecycle state 是否仍有必要。"
    required: true
    dependsOn:
      - "establish-action-package-and-result-admission"
    state: completed
    architectureImpact: true
    outputs:
      - "single-Action invocation / terminal / STOP boundary"
      - "internal prepare boundary contract"
      - "resumed-state necessity decision"

  - id: "establish-policy-and-next-boundary-contract"
    group: "governance"
    goal: "建立 deterministic legal-boundary Policy，计算当前合法 Action、下一 boundary 与 blocked diagnosis。"
    required: true
    dependsOn:
      - "establish-lifecycle-authority-and-identity-contracts"
      - "establish-single-action-execution-terminal-boundary"
    state: completed
    architectureImpact: true
    outputs:
      - "Policy decision contract"
      - "next-boundary contract"

  - id: "establish-cross-delivery-memo-contract"
    group: "governance"
    goal: "建立重要但不属于当前 Delivery 的 cross-Delivery Memo durable contract，并在未来 Delivery Start 主要暴露 open Memos 供 Owner 决定纳入、继续延后或 dismiss；Memo 不成为 blocker、当前 backlog 或 specification truth。"
    required: true
    dependsOn:
      - "establish-policy-and-next-boundary-contract"
    state: completed
    architectureImpact: true
    outputs:
      - "cross-Delivery Memo durable contract"
      - "Delivery Start Memo exposure contract"

  - id: "establish-mutation-and-git-checkpoint-boundary"
    group: "governance"
    goal: "建立 mutation declaration/scope、repository path contract、checkpoint eligibility 与 explicit Git authorization boundary。"
    required: true
    dependsOn:
      - "establish-cross-delivery-memo-contract"
    state: planned
    architectureImpact: true
    outputs:
      - "mutation authority contract"
      - "Git checkpoint boundary"

  - id: "establish-managed-toolchain-resolution"
    group: "integration"
    goal: "让 candidate 读取 toolchain.lock、解析 FLOWKIT_HOME、精确识别 OpenSpec/Archify runtime 并 fail closed。"
    required: true
    dependsOn:
      - "establish-lifecycle-authority-and-identity-contracts"
    state: planned
    architectureImpact: true
    outputs:
      - "managed toolchain resolution"
      - "runtime identity diagnostics"

  - id: "establish-openspec-thin-integration"
    group: "integration"
    goal: "建立 Flowkit 对 OpenSpec formal Change artifacts/operations 的 thin integration，不复制其 state machine。"
    required: true
    dependsOn:
      - "establish-managed-toolchain-resolution"
      - "establish-policy-and-next-boundary-contract"
    state: planned
    architectureImpact: true
    outputs:
      - "OpenSpec thin adapter boundary"
      - "formal artifact observation"

  - id: "establish-foundation-cli-surface"
    group: "integration"
    goal: "将已存在的 Core contract 暴露为最小 CLI，CLI 不成为第二套 lifecycle implementation。"
    required: true
    dependsOn:
      - "establish-single-action-execution-terminal-boundary"
      - "establish-policy-and-next-boundary-contract"
      - "establish-mutation-and-git-checkpoint-boundary"
      - "establish-openspec-thin-integration"
    state: planned
    architectureImpact: true
    outputs:
      - "minimal Flowkit CLI surface"

  - id: "validate-foundation-manager-cross-platform"
    group: "acceptance"
    goal: "完成 Windows Native 与 Linux x64 detached whole-manager acceptance，并形成独立验收 evidence。"
    required: true
    dependsOn:
      - "establish-foundation-cli-surface"
    state: planned
    architectureImpact: false
    outputs:
      - "Windows acceptance evidence"
      - "Linux detached acceptance evidence"

