verification:
  change:
    requireApplicableChecks: true
  fullTest:
    requiresOwnerAuthorization: true
    execution:
      state: deferred
      reason: "Delivery Start 时 Foundation CLI / whole-manager verification commands 尚未实现；不得伪造 command contract。正式 Full Test authorization 前必须由已实现能力冻结 exact execution contract。"
    plan:
      - "targeted Change verification selected by actual risk"
      - "whole-manager type/build/lint/test gates once those commands exist"
      - "OpenSpec 1.10.0 thin integration"
      - "single-Action invocation with internal prepare/package/admission/terminal and one final STOP"
      - "Run / Result durability and exact admission"
      - "Policy and blocked diagnosis"
      - "mutation and Git checkpoint safety"
      - "Windows Native acceptance"
      - "Linux x64 detached acceptance"
      - "baseline/candidate regression classification"

acceptance:
  - "Delivery 01 candidate never becomes authority for its own lifecycle."
  - "Owner, Author, Reviewer and Verification authority remain distinct and fail closed."
  - "Exactly one current Action can be prepared, executed through an exact ActionPackage, admitted to terminal by an exact Result, then execution stops after reporting the continuation fact."
  - "Run / Result facts are durable, real and integrity-checked; no fake terminal artifacts are admitted."
  - "Policy computes one legal boundary or a deterministic blocked diagnosis and never auto-executes next."
  - "Mutation and Git checkpoint permission require explicit authority and are not inferred from Verification or Review alone."
  - "Managed OpenSpec 1.10.0 and Archify 2.15.0 resolve from exact external identities without silent PATH fallback."
  - "OpenSpec remains formal Change authority and Archify remains derived/non-authoritative."
  - "Windows Native and Linux x64 detached acceptance both pass before Owner promotion."
  - "Only Delivery Final plus explicit Owner promotion makes the Foundation Manager eligible to manage Delivery 02."
