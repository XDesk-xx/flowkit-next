verification:
  change:
    requireApplicableChecks: true
  fullTest:
    requiresOwnerAuthorization: true
    execution:
      state: deferred
      reason: "Exact Delivery Full Test execution contract 已冻结；formal Verification 继续等待 final Change archive → exact checkpoint candidate → explicit Owner Full Test authorization。"
      environment:
        nodeCompatibility: ">=22.20.0"
        deterministicNodeFixture: "22.23.2"
        packageManagerFixture: "pnpm@11.22.0"
        dependencies: "repository dependencies are restored before execution"
        pnpmScriptDependencyCheck: "pnpm_config_verify_deps_before_run=false for the restored offline node_modules fixture so gate execution cannot trigger pnpm install"
        flowkitHome: "FLOWKIT_HOME must be explicit"
        managedTools:
          - "OpenSpec 1.10.0 exact managed runtime"
          - "Archify 2.15.0 exact managed runtime"
        fallback: "no install/update/download/network/PATH/global managed-tool fallback"
      gates:
        - "pnpm typecheck"
        - "pnpm format:check"
        - "pnpm build"
        - "pnpm test:domain"
        - "exact managed OpenSpec 1.10.0: validate --all --strict"
        - "pnpm test:acceptance"
    plan:
      - "pnpm test:acceptance includes real Linux x64 detached whole-manager acceptance plus windows-compatibility-simulation"
      - "lint is intentionally absent because this repository has no executable lint contract"
      - "Change-stage Author/Reviewer acceptance evidence is not formal Delivery Verification"
      - "Windows compatibility simulation does not claim cmd.exe, PowerShell, NTFS-specific, .cmd shim, or native Windows process coverage"

acceptance:
  - "Delivery 01 candidate never becomes authority for its own lifecycle."
  - "Owner, Author, Reviewer and Verification authority remain distinct and fail closed."
  - "Exactly one current Action can be prepared, executed through an exact ActionPackage, admitted to terminal by an exact Result, then execution stops after reporting the continuation fact."
  - "Run / Result facts are durable, real and integrity-checked; no fake terminal artifacts are admitted."
  - "Policy computes one legal boundary or a deterministic blocked diagnosis and never auto-executes next."
  - "Approved OpenSpec Change / contract remains the semantic mutation authority; Flowkit does not add a second durable per-Run or per-file mutation authority."
  - "Git checkpoint permission requires an explicit legal checkpoint boundary and explicit Owner authorization; Verification or Review alone never creates Git permission."
  - "Managed OpenSpec 1.10.0 and Archify 2.15.0 resolve from exact external identities without silent PATH fallback."
  - "OpenSpec remains formal Change authority and Archify remains derived/non-authoritative."
  - "Linux x64 detached real acceptance and Windows compatibility simulation both pass before Owner promotion."
  - "Only Delivery Final plus explicit Owner promotion makes the Foundation Manager eligible to manage Delivery 02."
